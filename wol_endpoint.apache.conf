# This is a basic sample Apache configuration file for the Wake-on-LAN endpoint.
# It is intended to be used as an example of basic requirements for deployment.
# Additional configurations and security hardening may be required for your specific use case.
    
    # Edit these variables to match your actual configuration.
    DEFINE wol_url 192.168.0.0
    DEFINE wol_port 5001
    DEFINE other_app_url localhost
    DEFINE other_app_port 5000
    DEFINE public_url your-domain.com

<VirtualHost *:443>
    ServerName ${public_url}
    ServerAlias www.${public_url}

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/your-domain.crt # edit to your actual cert file
    SSLCertificateKeyFile /etc/apache2/ssl/your-domain.key # edit to your actual key file

    # For Cloudflare Origin Pulls support
    SSLCACertificateFile /etc/apache2/ssl/cloudflare-origin-pull-ca.pem # edit to your actual CA file
    SSLVerifyClient require
    SSLVerifyDepth 1

    # --- Public static site ---
    # Delete if using proxied application/site.
    DocumentRoot /var/www/your-domain
    <Directory /var/www/your-domain>
        Require all granted
    </Directory>

    # --- Wake-on-LAN endpoint ---
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # More specific path MUST come first — Apache matches ProxyPass
    # directives in declaration order, and a catch-all "/" below would
    # otherwise swallow /wake requests before this line is ever reached.
    ProxyPassMatch ^/wake(/.*)?$ http://${wol_url}:${wol_port}/wake$1
    ProxyPassReverse /wake/ http://${wol_url}:${wol_port}/wake/

    # --- Proxied application/site ---
    # Catch-all for the rest of the site, declared after /wake
    # Delete if using static site.
    ProxyPass / http://${other_app_url}:${other_app_port}/
    ProxyPassReverse / http://${other_app_url}:${other_app_port}/
</VirtualHost>